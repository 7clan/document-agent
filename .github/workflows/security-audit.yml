name: Dependency security audit

on:
  push:
    branches:
      - feature/bounded-self-recovery
    paths:
      - scripts/audit_release_deps.py
      - requirements.lock
      - pyproject.toml
      - .github/workflows/security-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audit tools and actual runtime dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e '.[dev]'
          python -m pip install pip-audit
      - name: Check installed runtime and locked Windows dependencies
        run: python scripts/audit_release_deps.py
      - name: Preserve actual vulnerability findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-dependency-security-audit
          path: .local/security/*.json
          if-no-files-found: warn
          retention-days: 14
