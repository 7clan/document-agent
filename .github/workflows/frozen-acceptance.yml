name: Frozen 44-question real Gemini acceptance

on:
  push:
    branches:
      - feature/bounded-self-recovery
    paths:
      - scripts/run_frozen_acceptance.py
      - .github/workflows/frozen-acceptance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gemini-44:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-2.5-flash
      DOCUMENT_AGENT_RETRIEVAL_MODE: keyword
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Verify genuine provider authentication
        run: python scripts/validate_gemini.py
      - name: Replay all 44 frozen ground-truth questions through real app
        run: |
          python scripts/run_frozen_acceptance.py --provider gemini \
            --mode keyword --delay 2 --output .local/frozen_acceptance
      - name: Preserve verbatim observed answer and source references
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-44-real-gemini-answers
          path: .local/frozen_acceptance/acceptance_results.json
          retention-days: 14
          if-no-files-found: warn
