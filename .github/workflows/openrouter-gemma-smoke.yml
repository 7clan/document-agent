name: Real OpenRouter Gemma 4 tool-calling smoke

on:
  push:
    branches:
      - feature/bounded-self-recovery
    paths:
      - scripts/smoke_openrouter_gemma.py
      - .github/workflows/openrouter-gemma-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gemma:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      COMPATIBLE_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      COMPATIBLE_BASE_URL: https://openrouter.ai/api/v1
      COMPATIBLE_MODEL: google/gemma-4-31b-it
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require separately stored OpenRouter credential
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY secret missing: no real Gemma calls made."
            exit 1
          fi
      - name: Install compatible provider and document parser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,openai]'
      - name: Ask the actual Gemma 4 model questions through document-agent
        run: python scripts/smoke_openrouter_gemma.py
      - name: Upload real results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openrouter-gemma4-real-smoke-evidence
          path: .local/openrouter/gemma_openrouter_results.json
          retention-days: 14
          if-no-files-found: warn
