name: Checks
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python scripts/evaluate_retrieval.py --demo --mode keyword --k 3 > /dev/null
      - run: ruff check --fix --diff scripts/record_live_interview.py || true
      - run: ruff check src tests app.py scripts
