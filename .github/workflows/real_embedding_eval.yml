name: Optional real-model retrieval evaluation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/retrieval-evaluation-and-exact-ids

jobs:
  real-model-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local-embedding dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[embeddings]'
      - name: Evaluate real model against fictional labeled passages
        env:
          DOCUMENT_AGENT_EMBEDDING_ALLOW_DOWNLOAD: '1'
          DOCUMENT_AGENT_EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
        run: |
          python scripts/evaluate_retrieval.py --demo --mode both --k 3 --output retrieval_demo_report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fictional-retrieval-evaluation
          path: retrieval_demo_report.json
          if-no-files-found: ignore
