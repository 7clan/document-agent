name: Groq key and real model function calling smoke
on:
  push:
    branches: [experiment/groq-unseen-interview-2026-11-23]
    paths:
      - .github/workflows/groq-real-tool-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  direct-groq-tool-call:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.GROQ_API || secrets.GROQ_KEY || secrets.GROQ }}
    steps:
      - name: Install same OpenAI-compatible client as document-agent
        run: python -m pip install 'openai>=1.80,<3'
      - name: Verify available models and one genuine Groq function call
        shell: bash
        run: |
          python - <<'PY'
          import os
          from openai import OpenAI, APIStatusError
          key=os.getenv("GROQ_API_KEY","").strip()
          if not key:
              print("GROQ_PROBE missing_Groq_secret")
              raise SystemExit(1)
          client=OpenAI(api_key=key,base_url="https://api.groq.com/openai/v1",
                        timeout=40.0,max_retries=0)
          try:
              models=client.models.list()
              hosted={m.id for m in models.data}
              compatible=[v for v in ("openai/gpt-oss-20b",
                  "llama-3.3-70b-versatile","openai/gpt-oss-120b",
                  "llama-3.1-8b-instant") if v in hosted]
              print("GROQ_PROBE client_models_loaded",
                    bool(hosted),"supported_tool_models",compatible)
              if not compatible:
                  raise RuntimeError("No preferred tool-capable model")
              model=compatible[0]
              tools=[{"type":"function","function":{
                  "name":"read_source","description":"Return original document facts",
                  "parameters":{"type":"object","properties":{
                      "source_id":{"type":"string"}},
                      "required":["source_id"]}}}]
              response=client.chat.completions.create(
                  model=model,messages=[{"role":"user",
                      "content":"Use read_source with source_id R-17 to answer the source."}],
                  tools=tools,tool_choice="required",temperature=0,max_tokens=180)
              actual=[c.function.name for c in
                      (response.choices[0].message.tool_calls or [])]
              ok="read_source" in actual
              print("GROQ_PROBE real_model_tool_call",ok,"model",model)
              if not ok:
                  raise RuntimeError("Model did not call required tool")
          except APIStatusError as err:
              print("GROQ_PROBE provider_http_error",err.status_code)
              raise SystemExit(1)
          except (RuntimeError, OSError, ValueError) as err:
              print("GROQ_PROBE safe_error_kind",type(err).__name__)
              raise SystemExit(1)
          PY
