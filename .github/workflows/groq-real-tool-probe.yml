name: Groq key and real model function calling smoke
on:
  push:
    branches: [experiment/groq-unseen-interview-2026-11-23]
    paths:
      - .github/workflows/groq-real-tool-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  direct-groq-tool-call:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.GROQ_API || secrets.GROQ_KEY || secrets.GROQ }}
    steps:
      - name: Verify available models and one genuine Groq function call
        shell: bash
        run: |
          python - <<'PY'
          import json,os,urllib.request,urllib.error
          key=os.getenv('GROQ_API_KEY','').strip()
          if not key:
              print('GROQ_PROBE missing_Groq_secret')
              raise SystemExit(1)
          root='https://api.groq.com/openai/v1'
          def call(path,method='GET',body=None):
              req=urllib.request.Request(
                  root+path, data=json.dumps(body).encode() if body else None,
                  method=method,
                  headers={'Authorization':'Bearer '+key,'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=50) as response:
                  return json.load(response),response.status
          try:
              catalog,status=call('/models')
              hosted={m.get('id') for m in catalog.get('data',[])}
              compatible=[v for v in ('openai/gpt-oss-20b','llama-3.3-70b-versatile',
                  'openai/gpt-oss-120b','llama-3.1-8b-instant') if v in hosted]
              print('GROQ_PROBE model_catalog_http',status,'supported_tool_models',compatible)
              if not compatible:
                  raise RuntimeError('No preferred tool-capable model available')
              model=compatible[0]
              tools=[{'type':'function','function':{
                  'name':'read_source','description':'Return the original indexed document fact',
                  'parameters':{'type':'object','properties':{
                      'source_id':{'type':'string','description':'Document identifier'}
                  },'required':['source_id']}}}]
              result,http=call('/chat/completions','POST',{
                  'model':model,
                  'messages':[{'role':'user',
                      'content':'To answer what the signed invoice says about asset R-17, '
                       'you MUST call read_source first with source_id R-17.'}],
                  'tools':tools,'tool_choice':'required',
                  'temperature':0,'max_tokens':160})
              choices=result.get('choices',[])
              toolcalls=(choices[0].get('message',{}).get('tool_calls') or []) if choices else []
              valid=any(t.get('function',{}).get('name')=='read_source' for t in toolcalls)
              print('GROQ_PROBE real_tool_call_http',http,'model',model,
                    'function_call_returned',valid)
              if not valid:
                  raise RuntimeError('Model failed real tool-call test')
          except urllib.error.HTTPError as e:
              print('GROQ_PROBE provider_http_error',e.code)
              raise SystemExit(1)
          except (RuntimeError,urllib.error.URLError,ValueError,OSError,TimeoutError) as e:
              print('GROQ_PROBE safe_error_kind',type(e).__name__)
              raise SystemExit(1)
          PY
