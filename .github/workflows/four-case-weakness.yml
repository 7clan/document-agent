name: Live four-case weakness acceptance

on:
  push:
    branches:
      - feature/bounded-self-recovery
    paths:
      - evaluation/TRIGGER_WEAK4.txt
  workflow_dispatch:

concurrency:
  group: document-agent-paid-acceptance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  four-original-weaknesses:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPATIBLE_API_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.OPEN_ROUTER_API_KEY || secrets.OPENROUTER_KEY || secrets.OPENROUTER }}
      COMPATIBLE_BASE_URL: https://openrouter.ai/api/v1
      COMPATIBLE_MODEL: google/gemma-4-31b-it
      DOCUMENT_AGENT_RETRIEVAL_MODE: keyword
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require existing private OpenRouter key
        run: |
          if [ -z "$COMPATIBLE_API_KEY" ]; then
            echo 'OpenRouter key missing; no paid requests performed'
            exit 1
          fi
      - name: Install actual application
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,openai]'
      - name: Replay four original unchanged weak cases
        run: |
          python scripts/run_frozen_acceptance.py \
            --provider compatible --mode keyword \
            --ids 14,23,41,42 --delay 2 \
            --output .local/four_case_live
      - name: Preserve original answered text, tool calls and citations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-case-live-weakness-report
          path: .local/four_case_live/acceptance_results.json
          if-no-files-found: warn
          retention-days: 14
